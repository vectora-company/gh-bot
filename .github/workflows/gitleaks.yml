name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install pinned gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan repository
        run: gitleaks dir . --redact --no-banner
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git . --redact --no-banner --log-opts="$BASE_SHA..$HEAD_SHA"
      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            gitleaks git . --redact --no-banner --log-opts="-1 $AFTER_SHA"
          else
            gitleaks git . --redact --no-banner --log-opts="$BEFORE_SHA..$AFTER_SHA"
          fi
