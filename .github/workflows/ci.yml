name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: SCons / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install SCons
        run: python -m pip install scons
      - name: Detect environment
        run: python utils/checks.py environment
      - name: Install dependencies and run complete checks
        run: scons ci

  pull-request-metadata:
    if: github.event_name == 'pull_request'
    name: Pull request title and description
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate title and description
        run: python utils/checks.py pr-metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

  pre-commit:
    if: github.event_name == 'pull_request'
    name: Pre-commit hooks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install repository tools
        run: python -m pip install scons pre-commit
      - name: Install locked app dependencies
        run: pnpm install --frozen-lockfile
      - name: Run hooks on PR changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pre-commit run --show-diff-on-failure --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA"
      - name: Ensure hooks did not modify files
        run: git diff --exit-code
